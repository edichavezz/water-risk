<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Andalucía water data → insight coverage map</title>
<style>
  :root{
    --color-text-primary:#1f2937;

    --color-border-secondary:#d3d1c7;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --color-text-primary:#ececec;
      --color-text-secondary:#b4b2a9;
      --color-background-primary:#1c1c1a;
      --color-border-secondary:#444441;
    }
    body{background:#141413;}
  }
  body{margin:0;padding:24px;background:#faf9f7;font-family:-apple-system,system-ui,'Segoe UI',sans-serif;}
  .wrap{max-width:820px;margin:0 auto;}

</style>

<body>
<div class="wrap">
<svg viewBox="0 0 780 952" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
<title>Andalucía water data to insight coverage map</title>
<desc>Ten app insights mapped to their data sources and coloured by how much of Andalucía each covers: uniform national coverage, federated across two basin authorities, or patchy and needing curation.</desc>

<text x="40" y="34" font-size="21" font-weight="700" fill="var(--color-text-primary)">Andalucía: data source → insight coverage</text>
<text x="40" y="56" font-size="13" fill="var(--color-text-secondary)">Which source feeds each insight, and how much of Andalucía it actually covers.</text>

<text x="40" y="90" font-size="12.5" font-weight="600" fill="var(--color-text-secondary)">Reservoirs, drought status &amp; water rights are split across TWO authorities — you need both:</text>

<rect x="40" y="100" width="6" height="64" rx="3" fill="#C98A00"/>
<text x="58" y="126" font-size="12.5" font-weight="700" fill="var(--color-text-primary)">STATE — CH del Guadalquivir</text>
<text x="58" y="146" font-size="11" fill="var(--color-text-secondary)">Guadalquivir basin · most of inland Andalucía</text>
<rect x="400" y="100" width="340" height="64" rx="12" fill="var(--color-background-primary)" stroke="#C98A00" stroke-width="1.5"/>
<rect x="400" y="100" width="6" height="64" rx="3" fill="#C98A00"/>

<text x="418" y="146" font-size="10.5" fill="var(--color-text-secondary)">Guadalete-Barbate · Tinto-Odiel-Piedras · C. Mediterráneas</text>

<rect x="40" y="186" width="340" height="112" rx="12" fill="#E9F6F0" stroke="#1D9E75" stroke-width="1.3"/>

<text x="58" y="218" font-size="15" font-weight="700" fill="#1f2937">Riverine flood exposure</text>

<rect x="400" y="186" width="340" height="112" rx="12" fill="#E9F6F0" stroke="#1D9E75" stroke-width="1.3"/>

<rect x="40" y="310" width="340" height="112" rx="12" fill="#E9F6F0" stroke="#1D9E75" stroke-width="1.3"/>

<rect x="400" y="310" width="340" height="112" rx="12" fill="#E9F6F0" stroke="#1D9E75" stroke-width="1.3"/>

<text x="692" y="337" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Uniform</text>

<text x="58" y="494" font-size="11.5" fill="#4b5563">Source: SINAC + utility pages (CAZG, EMASESA)</text>

<rect x="400" y="434" width="340" height="112" rx="12" fill="#FBF2D6" stroke="#C98A00" stroke-width="1.3"/>

<rect x="648" y="446" width="80" height="22" rx="11" fill="#B8860B"/>

<text x="418" y="494" font-size="11.5" fill="#4b5563">Source: CHG + Junta drought orders (BOJA)</text>

<text x="418" y="652" font-size="11" fill="#6b7280">Scale: aquifer body · sparse monitoring</text>

<rect x="40" y="682" width="340" height="112" rx="12" fill="#FBEBEB" stroke="#D14848" stroke-width="1.3"/>

<text x="58" y="776" font-size="11" fill="#6b7280">Scale: parcel / plan · per-municipality</text>

<rect x="400" y="682" width="340" height="112" rx="12" fill="#FBEBEB" stroke="#D14848" stroke-width="1.3"/>

<rect x="664" y="694" width="64" height="22" rx="11" fill="#D14848"/>

<text x="418" y="714" font-size="15" font-weight="700" fill="#1f2937">Governance &amp; questions</text>
<text x="418" y="742" font-size="11.5" fill="#4b5563">Source: editorial — competency / org records</text>

<line x1="40" y1="818" x2="740" y2="818" stroke="var(--color-border-secondary)" stroke-width="1"/>
<rect x="40" y="834" width="16" height="16" rx="4" fill="#1D9E75"/>

<rect x="40" y="862" width="16" height="16" rx="4" fill="#C98A00"/>
<text x="64" y="875" font-size="11.5" fill="var(--color-text-primary)"><tspan font-weight="700">Federated</tspan> — full coverage, but stitched from 2+ systems</text>
<rect x="420" y="862" width="16" height="16" rx="4" fill="#D14848"/>
<text x="444" y="875" font-size="11.5" fill="var(--color-text-primary)"><tspan font-weight="700">Patchy</tspan> — per-municipality / thin / must curate</text>
